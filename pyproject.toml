[project]
name = "omge"
version = "0.1.2"
description = "Graph-enforced workflows for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
omge = "omge.cli:main"
omge-mcp = "omge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
